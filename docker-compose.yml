services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: guardiao
      POSTGRES_PASSWORD: guardiao
      POSTGRES_DB: guardiao
    ports:
      # 5433 no computador, para não disputar a 5432 com outro Postgres local.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
